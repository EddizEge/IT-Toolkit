name: Release EXE

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Yayın etiketini al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Sürüm adını doğrula
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $packageVersion = python -c "from app_v2 import __version__; print('v' + __version__)"
          if ($tag -ne $packageVersion) {
            throw "Etiket ($tag) ile uygulama sürümü ($packageVersion) eşleşmiyor."
          }

      - name: Testleri çalıştır
        run: |
          ruff check app_v2 tests main_v2.py
          python -m unittest discover -s tests -v

      - name: Windows EXE oluştur
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "IT_Toolkit_$tag" `
            --icon "assets/brand/it_toolkit.ico" `
            --add-data "assets/brand/it_toolkit.ico;assets/brand" `
            "main_v2.py"

      - name: EXE SHA-256 özeti oluştur
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $exe = "dist/IT_Toolkit_$tag.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  IT_Toolkit_$tag.exe" | Set-Content -Encoding ascii "dist/IT_Toolkit_$tag.exe.sha256"

      - name: Dosyaları Release'e yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          gh release upload $tag `
            "dist/IT_Toolkit_$tag.exe" `
            "dist/IT_Toolkit_$tag.exe.sha256" `
            --clobber
